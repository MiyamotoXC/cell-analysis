# 单细胞图像处理数据集配置（LIVECell，实例分割）
# 参考：Sartorius LIVECell (Nature Methods 2021)
# 任务：实例分割（YOLOv8-seg），输出 mask，指标 mask AP
# 由原钢材缺陷检测项目（../yolo-cases）克隆重构；本配置取代钢材的 steel_data/dataset.yaml。

path: ./cell_data            # 数据集根目录（先运行 download_livecell.py + convert_livecell.py 生成）
train: images/train          # 训练图像（相对 path）
val: images/val              # 验证图像
test: images/test            # 测试图像（可选）

# 类别：单类 cell（LIVECell 官方任务即单类分割，160 万细胞同标 1 类）。
# 不按细胞系分 8 类的原因：数据集自带划分按采集批次走，各 split 的细胞系
# 几乎不重叠，多类训练时验证集类别从未出现在训练集里，mAP 恒为 0。
names:
  0: cell

# 训练（实例分割）：
#   yolo train model=yolov8n-seg.pt data=livecell.yaml task=segment
# 评估：
#   yolo val model=runs/segment/train/weights/best.pt data=livecell.yaml task=segment
